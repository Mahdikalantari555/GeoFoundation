version: "3.9"

# Production / Qdrant stack
# Usage: docker compose up -d

services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  geomemory-ui:
    build:
      context: .
      target: ui
    ports:
      - "8501:8501"
    environment:
      GEOMEMORY_QDRANT_URL: http://qdrant:6333
      GEOMEMORY_WORKSPACE: /workspace
    volumes:
      - workspace_data:/workspace
      - hf_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy

  # Lightweight CLI service (core target — no AI/vision deps)
  geomemory-cli:
    build:
      context: .
      target: core
    environment:
      GEOMEMORY_WORKSPACE: /workspace
    volumes:
      - workspace_data:/workspace
    profiles:
      - cli
    entrypoint: ["geomemory"]

volumes:
  qdrant_storage:
  workspace_data:
  hf_cache:

---
# Development profile — bind-mount src/, no rebuilds needed
# Usage: docker compose --profile dev up

# NOTE: Docker Compose merge key 'x-' for development-only config.
# For full dev mode, use docker-compose.override.yml or:
#
#   docker compose --profile dev up
#
