[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geomemory"
version = "0.1.0"
description = "A multimodal, spatiotemporal knowledge engine for remote sensing research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GeoMemory Contributors" }]
keywords = ["remote-sensing", "rag", "gis", "embeddings", "search", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "click>=8.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Core AI/retrieval stack (heavy but always recommended)
ai = [
    "txtai>=8.0",
    "llama-cpp-python>=0.2.0",
]
# Document parsing
docs = [
    "pymupdf>=1.23",
    "python-docx>=1.0",
]
# Remote sensing
rs = [
    "rasterio>=1.3",
    "shapely>=2.0",
    "geopandas>=0.14",
    "Pillow>=10.0",
]
# Sentence-transformers dense text embeddings
st = [
    "sentence-transformers>=3.0",
]
# Qdrant server-mode vector backend
vector = [
    "qdrant-client>=1.10",
]
# Vision (image embeddings via OLMoEarth Nano torch weights)
vision = [
    "torch>=2.0",
    "Pillow>=10.0",
]
# OpenDataLoader PDF parsing (optional high-quality PDF backend)
opendataloader = [
    "opendataloader-pdf>=2.5,<3",
]
# Streamlit reference UI
ui = [
    "streamlit>=1.30",
]
# Development
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[project.scripts]
geomemory = "geomemory.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geomemory = ["storage/schema.sql", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "golden: golden tests with fixed fixtures",
    "e2e: end-to-end CLI tests",
    "spike: txtai/embedding spike validation",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["B008"]  # Function call in default argument (e.g. Field(default_factory=...))

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
check_untyped_defs = true
disallow_any_generics = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
exclude = ["tests/", "scripts/", "apps/"]

[tool.coverage.run]
source = ["geomemory"]
omit = ["*/tests/*", "*/apps/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true