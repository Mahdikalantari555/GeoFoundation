name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core package
        run: |
          pip install -e .
      - name: Install dev tools
        run: |
          pip install ".[dev]"
      - name: Ruff check
        run: ruff check src/ tests/
      - name: mypy --strict
        run: mypy --strict src/geomemory

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev deps
        run: |
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          pytest tests/unit tests/integration -m "not spike" -q
      - name: Coverage
        run: |
          pytest --cov=geomemory.core --cov=geomemory.storage --cov=geomemory.ingest --cov=geomemory.retrieval --cov=geomemory.qa --cov-report=term-missing -q