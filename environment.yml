name: geospatial
channels:
  - conda-forge
  - defaults
dependencies:
  # ── Python ──────────────────────────────────────────────────────────────
  - python=3.12
  - pip

  # ── Core scientific ─────────────────────────────────────────────────────
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - scikit-image>=0.21
  - matplotlib>=3.7
  - seaborn>=0.12
  - xarray>=2023.1
  - dask>=2023.1
  - netcdf4>=1.6
  - cftime>=1.6
  - h5py>=3.8
  - zarr>=2.14
  - tqdm>=4.65

  # ── Geospatial core ─────────────────────────────────────────────────────
  - geopandas>=0.14
  - rasterio>=1.3
  - shapely>=2.0
  - fiona>=1.9
  - pyproj>=3.6
  - cartopy>=0.22
  - rioxarray>=0.14
  - xesmf>=0.7  # optional regridding

  # ── Remote sensing / STAC ───────────────────────────────────────────────
  - pystac>=1.8
  - pystac-client>=0.7
  - planetary-computer>=1.0
  - stackstac>=0.5
  - sentinelsat>=1.2
  - earthpy>=0.9

  # ── Data formats & IO ──────────────────────────────────────────────────
  - pyyaml>=6.0
  - click>=8.1
  - requests>=2.28
  - fsspec>=2023.1
  - aiohttp>=3.8

  # ── Web / API ───────────────────────────────────────────────────────────
  - fastapi>=0.115
  - uvicorn>=0.30
  - python-multipart>=0.0.9
  - pydantic>=2.0

  # ── Dev & testing ───────────────────────────────────────────────────────
  - pytest>=8.0
  - pytest-cov>=5.0
  - ruff>=0.5
  - mypy>=1.10
  - ipython>=8.12

  # ── Jupyter (optional) ──────────────────────────────────────────────────
  - jupyterlab>=4.0
  - ipykernel>=6.25

  # ── pip-only packages ───────────────────────────────────────────────────
  - pip:
      # ── Project packages (editable) ─────────────────────────────────────
      - -e libs/geomemory
      - -e libs/geoagent
      - -e server

      # ── GeoMemory optional extras (uncomment as needed) ────────────────
      # - txtai>=8.0
      # - llama-cpp-python>=0.2.0
      # - sentence-transformers>=3.0
      # - qdrant-client>=1.10
      # - torch>=2.0
      # - olmoearth-pretrain>=0.1.1
      # - pymupdf>=1.23
      # - python-docx>=1.0
      # - opendataloader-pdf>=2.5,<3
      # - streamlit>=1.30

      # ── GeoAgent extras ─────────────────────────────────────────────────
      # (geomemory pulled via editable install above)

      # ── Server extras ───────────────────────────────────────────────────
      - httpx>=0.27
      - httpx2>=2.12  # starlette test client compat

      # ── Additional pip-only utilities ───────────────────────────────────
      - loguru>=0.7
      - python-dotenv>=1.0
      - geopy>=2.4
      - geojson>=3.1
      - html2text>=2024.2
