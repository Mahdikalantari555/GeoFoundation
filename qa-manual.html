<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GeoFoundation — Manual QA / Unit Test Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gf-bg: oklch(0.985 0.002 250);
  --gf-panel: oklch(1 0 0);
  --gf-border: oklch(0.92 0.005 250);
  --gf-text: oklch(0.21 0.03 255);
  --gf-muted: oklch(0.52 0.02 255);
  --gf-accent: oklch(0.55 0.14 250);
  --gf-accent-soft: oklch(0.95 0.03 250);
  --gf-ok: oklch(0.62 0.15 150);
  --gf-warn: oklch(0.72 0.15 75);
  --gf-err: oklch(0.58 0.19 25);
}
@media (prefers-color-scheme: dark){
  :root{
    --gf-bg: oklch(0.17 0.015 255);
    --gf-panel: oklch(0.21 0.018 255);
    --gf-border: oklch(0.28 0.02 255);
    --gf-text: oklch(0.93 0.01 250);
    --gf-muted: oklch(0.68 0.02 255);
    --gf-accent: oklch(0.7 0.13 250);
    --gf-accent-soft: oklch(0.26 0.04 255);
    --gf-ok: oklch(0.72 0.14 150);
    --gf-warn: oklch(0.78 0.13 75);
    --gf-err: oklch(0.66 0.17 25);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{animation:none!important;transition:none!important} }
body{
  margin:0; background:var(--gf-bg); color:var(--gf-text);
  font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Vazirmatn', sans-serif;
  line-height:1.6; font-variant-numeric: lining-nums;
}
code, .mono{ font-family: 'JetBrains Mono', ui-monospace, monospace; direction:ltr; unicode-bidi:isolate; font-size:.88em}
a{color:var(--gf-accent); text-decoration:none}
a:hover{text-decoration:underline}
header.top{
  position:sticky; top:0; z-index:40; backdrop-filter:blur(8px);
  background:color-mix(in oklch, var(--gf-panel) 92%, transparent);
  border-bottom:1px solid var(--gf-border);
}
.top-inner{max-width:1280px; margin:0 auto; padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.top h1{font-size:1.05rem; margin:0; font-weight:700}
.badge{font-size:.7rem; border:1px solid var(--gf-border); border-radius:999px; padding:2px 8px; color:var(--gf-muted); background:var(--gf-panel)}
.progress{height:6px; background:var(--gf-border); border-radius:999px; overflow:hidden; flex:1 1 200px; max-width:360px}
.progress > div{height:100%; display:flex}
.progress > div > span{height:100%; transition:width .2s}
.p-ok{background:var(--gf-ok)} .p-fail{background:var(--gf-err)} .p-na{background:var(--gf-warn)} .p-rem{background:transparent}
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.toolbar input, .toolbar select{border:1px solid var(--gf-border); border-radius:8px; padding:6px 10px; background:var(--gf-panel); color:var(--gf-text); font-size:.85rem}
.toolbar button{border:1px solid var(--gf-border); background:var(--gf-panel); color:var(--gf-text); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:.82rem}
.toolbar button.primary{background:var(--gf-accent); color:#fff; border-color:var(--gf-accent)}
.layout{max-width:1280px; margin:0 auto; display:grid; grid-template-columns:220px 1fr; gap:18px; padding:18px 16px}
@media (max-width: 900px){ .layout{grid-template-columns:1fr} .toc{position:static!important; max-height:none!important} .top{position:static} }
.toc{position:sticky; top:78px; align-self:start; max-height:calc(100vh - 90px); overflow:auto; border:1px solid var(--gf-border); border-radius:12px; background:var(--gf-panel); padding:10px}
.toc h2{font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--gf-muted); margin:0 0 8px}
.toc a{display:block; padding:5px 8px; border-radius:8px; font-size:.82rem; color:var(--gf-text)}
.toc a.active{background:var(--gf-accent-soft); color:var(--gf-accent); font-weight:600}
.toc .cnt{float:inline-end; font-size:.7rem; color:var(--gf-muted); border:1px solid var(--gf-border); border-radius:999px; padding:0 6px; background:var(--gf-bg)}
main{ min-width:0}
section.card{border:1px solid var(--gf-border); background:var(--gf-panel); border-radius:14px; overflow:hidden; margin-bottom:16px}
section.card > header{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--gf-border); cursor:pointer; user-select:none}
section.card > header h2{margin:0; font-size:.98rem; flex:1}
.mini{height:4px; flex:1 1 120px; max-width:180px; background:var(--gf-border); border-radius:999px; overflow:hidden; display:flex}
.mini > span{height:100%}
.count{font-size:.75rem; color:var(--gf-muted); border:1px solid var(--gf-border); border-radius:999px; padding:2px 8px; background:var(--gf-bg)}
.table{width:100%; border-collapse:collapse; font-size:.84rem}
.table th, .table td{border-top:1px solid var(--gf-border); padding:8px 10px; text-align:start; vertical-align:top}
.table th{font-size:.75rem; color:var(--gf-muted); text-transform:uppercase; letter-spacing:.04em; background:color-mix(in oklch, var(--gf-bg) 70%, var(--gf-panel))}
.table tr.pass{ background: color-mix(in oklch, var(--gf-ok) 10%, var(--gf-panel))}
.table tr.fail{ background: color-mix(in oklch, var(--gf-err) 10%, var(--gf-panel))}
.table tr.na{ background: color-mix(in oklch, var(--gf-warn) 12%, var(--gf-panel))}
.id{white-space:nowrap; font-weight:600}
.actions{display:flex; gap:4px; flex-wrap:wrap}
.actions button{width:32px; height:28px; border-radius:8px; border:1px solid var(--gf-border); background:var(--gf-panel); cursor:pointer; font-weight:700}
.actions button.on-pass{background:var(--gf-ok); color:#fff; border-color:var(--gf-ok)}
.actions button.on-fail{background:var(--gf-err); color:#fff; border-color:var(--gf-err)}
.actions button.on-na{background:var(--gf-warn); color:#111; border-color:var(--gf-warn)}
.note{font-size:.78rem; padding:6px 8px; border-radius:8px; margin-top:6px; border:1px solid}
.note.info{ background: color-mix(in oklch, var(--gf-accent) 10%, var(--gf-panel)); border-color: color-mix(in oklch, var(--gf-accent) 30%, var(--gf-border)); color: var(--gf-text)}
.note.warn{ background: color-mix(in oklch, var(--gf-warn) 14%, var(--gf-panel)); border-color: var(--gf-warn)}
.note.danger{ background: color-mix(in oklch, var(--gf-err) 12%, var(--gf-panel)); border-color: var(--gf-err); color: color-mix(in oklch, var(--gf-err) 80%, black)}
.kbd{border:1px solid var(--gf-border); border-bottom-width:2px; border-radius:6px; padding:1px 6px; background:var(--gf-bg); font-size:.78rem}
.backtop{position:fixed; inset-inline-end:16px; inset-block-end:16px; width:42px; height:42px; border-radius:999px; border:1px solid var(--gf-border); background:var(--gf-panel); color:var(--gf-text); cursor:pointer; display:grid; place-items:center; box-shadow:0 4px 16px rgba(0,0,0,.12)}
@media print{ header.top, .toc, .toolbar, .actions, .backtop{display:none!important} section.card{break-inside:avoid} section.card > header{cursor:default} .table{font-size:.72rem} }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>GeoFoundation — Manual QA / Unit Test Manual</h1>
    <span class="badge">single-file • localStorage <span class="mono">gf-qa-manual-v1</span></span>
    <div class="progress" aria-label="overall progress"><div><span class="p-ok" id="p-ok"></span><span class="p-fail" id="p-fail"></span><span class="p-na" id="p-na"></span><span class="p-rem" id="p-rem"></span></div></div>
    <span class="badge" id="overallCounts">0 / 0</span>
    <div class="toolbar">
      <input id="search" placeholder="Search tests…" aria-label="Search"/>
      <select id="filter" aria-label="Filter">
        <option value="all">all</option>
        <option value="not-done">not-done</option>
        <option value="pass">pass</option>
        <option value="fail">fail</option>
        <option value="na">N/A</option>
      </select>
      <button id="expandBtn">expand all</button>
      <button id="resetBtn" class="primary">reset all</button>
    </div>
  </div>
</header>
<div class="layout">
  <nav class="toc" aria-label="Table of contents">
    <h2>Contents</h2>
    <div id="toc"></div>
  </nav>
  <main id="main"></main>
</div>
<button class="backtop" id="backtop" aria-label="Back to top">↑</button>

<script>
// data model — single source, rendered via textContent (XSS-safe). Add a test = add one row.
const QA_DATA = [
  {
    id: "0",
    title: "0 — Environment setup (read this first)",
    intro: "Settings to change before testing, required tools, storage/env, and full reset. For each setting: normal value → suggested test value + why.",
    rows: [
      { id: "0.1.1", action: "Set LLM env on gateway: GEOMEMORY_LLM_API_KEY (default, or custom via llm_api_key_env in PUT /workspace/settings). Normal: real key. Test: unset / empty string.", expectation: "GET /health and GET /workspace show llm.configured=false, llm.reachable=false without leaking key. No response contains the key string. POST /ask returns abstained=true with abstain_reason containing 'LLM unavailable'.", note: "Key is server-env only, never accepted from client, never returned (SPEC_SERVER). Removing it is the only way to test abstention deterministically.", kind: "info" },
      { id: "0.1.2", action: "Shorten job poll interval for ingest/index tests. Normal: UI polls GET /api/v1/jobs/{id} every 500 ms until done. Test: keep as is; do not add wait in test itself.", expectation: "Job transitions queued→running→done (or failed) within 5 s for a 1 kB txt file. Progress goes 0 → 1. No extra request needed.", note: "Jobs run in threadpool via asyncio.to_thread; single worker.", kind: "info" },
      { id: "0.2.1", action: "Browser: Chrome/Edge + DevTools network throttling. Terminal: conda env geospatial, pnpm 11. Required: curl, python 3.12.", expectation: "conda run -n geospatial uvicorn geofront_api.main:app --port 8000 serves /health 200. pnpm dev on :5173 proxies /api → :8000.", kind: "info" },
      { id: "0.3.1", action: "Full reset (clean start). Run: rm -rf /tmp/gf-test-ws && mkdir -p /tmp/gf-test-ws && curl -X POST http://localhost:8000/api/v1/workspace/close ; delete localStorage key gf-qa-manual-v1 and gf.language; clear IndexedDB not used.", expectation: "GET /workspace returns status=closed. GET /api/v1/collections returns 409 workspace_not_open envelope. localStorage has no gf-qa-manual-v1. After reload, language falls back to navigator.language.", note: "Storage keys: gf.language (en|fa), gf-qa-manual-v1 (this doc), gf.workspace (TanStack Query cache, memory only). Env vars: GEOMEMORY_LLM_API_KEY, GEOFOND_WORKSPACE.", kind: "info" },
      { id: "0.3.2", action: "Verify error envelope shape for any 4xx/5xx.", expectation: "Body is {error:{code:string,message:string,detail?:any}} with code=workspace_not_open|validation|not_found|http_error|internal_error and status 409|422|404|500. No stack trace leaks.", kind: "info" },
      { id: "0.4.1", action: "Set prefers-reduced-motion: emulate in DevTools Rendering → Emulate CSS media feature prefers-reduced-motion: reduce. Reload.", expectation: "No smooth scroll, no SVG sparkline animation, no modal fade. All transitions are instant (CSS @media reduce disables).", kind: "info" },
    ]
  },
  {
    id: "1",
    title: "1 — Health & gateway",
    rows: [
      { id: "1.1.1", action: "GET /health and GET /api/v1/health with no workspace open, no key.", expectation: "200 {status:'ok', workspace:'closed', llm:{provider:'api', configured:false, reachable:false}}." , note: "Health is the only route that works without workspace (SPEC_SERVER).", kind: "info" },
      { id: "1.1.2", action: "GET /api/v1/unknown-route", expectation: "404 envelope code=http_error, not 200, not HTML. Web shows not-found UI, not crash.", kind: "info" },
      { id: "1.2.1", action: "Offline: stop gateway (Ctrl+C), then navigate in web. Health pill + Search/Ask pages.", expectation: "Health pill shows 'Gateway offline' (red). Search shows 'Open a workspace to search' or fetch error, no unhandled rejection. Ask shows abstention or error card, page does not blank.", kind: "warn" },
      { id: "1.3.1", action: "Rapid double fetch GET /health (double-click reload).", expectation: "Two requests, both 200, no 429. No request is dropped.", kind: "info" },
      { id: "1.4.1", action: "Keyboard: Tab through header (WorkspaceSwitcher, HealthPill, LanguageToggle).", expectation: "All focusable elements have visible focus ring, Tab order is logical (ps→pe / start→end), Enter activates.", kind: "info" },
    ]
  },
  {
    id: "2",
    title: "2 — Workspace lifecycle (server/src/geofront_api/routers/workspace.py, state.py)",
    rows: [
      { id: "2.1.1", action: "POST /api/v1/workspace/create {path:'/tmp/gf-test-ws/a', name:'A'} — fresh dir.", expectation: "201 {status:'open', path:'/tmp/gf-test-ws/a'}. GET /workspace returns same. Second create with same path returns 409.", kind: "info" },
      { id: "2.1.2", action: "Input: POST /workspace/create with path='' (empty) or path='   ' (whitespace-only).", expectation: "422 validation, code=validation, detail contains path error. No workspace is created, no request to filesystem.", kind: "info" },
      { id: "2.1.3", action: "Input: POST /workspace/create with name 200 chars (over limit? check schema) and path containing .. traversal '/tmp/../tmp/gf-test-ws/b'.", expectation: "If name too long → 422. Path traversal is normalized but stays under /tmp; workspace creation succeeds with resolved path. No path outside allowed root is created.", note: "Path is resolved on server; not a security boundary beyond sandbox but should not create /etc.", kind: "warn" },
      { id: "2.2.1", action: "POST /workspace/open {path:'/tmp/gf-test-ws/a'} after close.", expectation: "200 {status:'open'}. GET /workspace/stats returns {asset_count, segment_count, storage_bytes} numbers, not null.", kind: "info" },
      { id: "2.2.2", action: "POST /workspace/open with non-existent path '/tmp/nope-xyz'.", expectation: "404 envelope code=not_found or 409 workspace_not_open, not 500. No workspace becomes open.", kind: "info" },
      { id: "2.3.1", action: "POST /workspace/close when open, then GET /workspace.", expectation: "200 {status:'closed'}. Second close is idempotent 200 closed, not 409. Subsequent GET /search returns 409 workspace_not_open.", kind: "info" },
      { id: "2.3.2", action: "Concurrency: 2 tabs call POST /workspace/close at same time (or rapid double-click Close button).", expectation: "One succeeds 200, the other 200 closed (idempotent). No 500, no SQLite BUSY leak. Write lock serializes.", kind: "info" },
      { id: "2.4.1", action: "PUT /workspace/settings {language:'fa'} then GET /workspace.", expectation: "200, settings.language='fa'. Web flips <html dir> to rtl, layout mirrors (ps/pe), no broken alignment. language='xx' → 422.", note: "Settings fields: name, language en|fa, offline, batch_size, model_path, embedding_path, vision_path, llm_provider api|llamacpp, llm_api_base_url, llm_model_id, llm_context_window, llm_api_key_env.", kind: "info" },
      { id: "2.4.2", action: "PUT /workspace/settings {llm_api_key_env:'GEOMEMORY_LLM_API_KEY', llm_provider:'api', llm_api_base_url:'http://example.com'} and then GET /workspace.", expectation: "200, but GET /workspace never returns the key value, only llm.key_configured boolean. Key not in response body.", note: "Security: key stays in server env, never persisted to DB, never sent to client (SPEC_SERVER). Absence of key is the bug.", kind: "danger" },
      { id: "2.4.3", action: "XSS: PUT /workspace/settings {name:'<img src=x onerror=alert(1)>'} then view Overview.", expectation: "Name is rendered as text, not HTML. No alert, no script execution. textContent used.", kind: "danger" },
      { id: "2.5.1", action: "GET /workspace/stats with no workspace open.", expectation: "409 workspace_not_open, not 500. Web shows 'No workspace' card, not crash.", kind: "info" },
    ]
  },
  {
    id: "3",
    title: "3 — Collections (server/routers/collections.py, jobs.py)",
    rows: [
      { id: "3.1.1", action: "POST /collections {name:'docs'} when workspace open.", expectation: "201 {id:string, name:'docs'}. GET /collections lists it. GET /collections/{id} returns same. Name is stored as provided (case preserved).", kind: "info" },
      { id: "3.1.2", action: "Input: POST /collections {name:''} , {name:'   '} , {name: 'a'.repeat(256)} , {name:'<svg onload=alert(1)>'}", expectation: "'' and '   ' → 422 validation. 256 chars → 422 if limit, or 201 if allowed but not truncated. XSS payload stored as plain text, rendered via textContent, no execution. Paste of 10k chars → 422 or truncated, no 500.", kind: "danger" },
      { id: "3.1.3", action: "POST /collections {name:'docs'} duplicate name (same case, then different case 'Docs').", expectation: "If duplicate allowed, 201 with different id; if not, 409 with code not_found? No 500. List shows both. No duplicate request is deduped by content hash (collections are not content-addressed).", note: "Collections are not deduped by SHA-256; only ingested files are.", kind: "info" },
      { id: "3.2.1", action: "DELETE /collections/{id} then GET /collections/{id}.", expectation: "DELETE 200, second GET 404 envelope. List no longer contains id. Assets in collection stay in workspace (archive, not delete).", kind: "info" },
      { id: "3.2.2", action: "DELETE /collections/invalid-uuid", expectation: "404 not_found, not 500. Error envelope.", kind: "info" },
      { id: "3.3.1", action: "Offline: stop gateway, click 'New collection' → Create in web.", expectation: "Button shows error alert role, no success, no duplicate request. After gateway back, retry succeeds.", kind: "warn" },
      { id: "3.4.1", action: "Rapid double-click Create with name='race' (not debounced).", expectation: "One request sent or two but server returns 201 + 409/201; UI does not create two collections with same id. Button disabled while isPending.", kind: "info" },
      { id: "3.5.1", action: "Web: Collections page loading state (throttle network to Slow 3G, reload).", expectation: "Shows 'Loading…' (aria-live) before data, not empty. Empty state 'No collections yet' only after load.", kind: "info" },
    ]
  },
  {
    id: "4",
    title: "4 — Ingest (server/routers/ingest.py — multipart + bytes, 202 job, SHA-256 dedup)",
    rows: [
      { id: "4.1.1", action: "POST /ingest multipart file=hello.txt (content 'hello world'), collection_id=valid, index_after=false.", expectation: "202 {job_id:string, status:'queued'}. GET /jobs/{job_id} → queued→running→done with result {asset_id, segment_count: >=1} or {skipped:false}. SSE emits job_progress and asset_created.", kind: "info" },
      { id: "4.1.2", action: "POST /ingest/bytes JSON {filename:'hello.txt', content_base64:'aGVsbG8gd29ybGQ=', collection_id, index_after:true}.", expectation: "202, same lifecycle, no multipart needed. Same dedup behavior as multipart.", kind: "info" },
      { id: "4.2.1", action: "Dedup: ingest same file bytes again (identical SHA-256) to same collection.", expectation: "Job result {skipped:true, asset_id:same} within 200 ms (no re-chunk). UI shows dedup banner 'Identical content (SHA-256 match) is already in the workspace.' No new asset count increment.", note: "Content identity = SHA-256 of raw bytes (ARCHITECTURE invariant). Second ingest must not create new revision.", kind: "info" },
      { id: "4.2.2", action: "Dedup boundary: ingest file with one byte changed (add '\\n'), same name.", expectation: "Not deduped. New asset_id, segment_count may differ. Hash differs, so stored.", kind: "info" },
      { id: "4.3.1", action: "Validation: POST /ingest without file, with empty file, with .docx (disabled), with .exe, with 100 MB tiff.", expectation: "No file → 422 validation. .docx → 422 or 400 with 'DOCX disabled' message. .exe → 422 unsupported. Oversize → 413 or 422, not 500.", kind: "info" },
      { id: "4.3.2", action: "Accepted types: pdf, txt, md, csv, py, ipynb, tif/tiff (GeoTIFF), geojson, gpkg each 1 kB.", expectation: "All except docx return 202. GeoTIFF and GeoJSON produce scenes/layers in inspect (if rs extras installed). No 500.", kind: "info" },
      { id: "4.4.1", action: "Offline: disconnect network after selecting file but before POST /ingest.", expectation: "Ingest shows 'Ingest failed' alert role, no job id, no polling. Retry succeeds when back.", kind: "warn" },
      { id: "4.4.2", action: "Malformed server response: mock GET /jobs/{id} to return {status:'done'} without result, or invalid JSON.", expectation: "Web shows error, not crash. Polling stops, page does not reload. No unhandled promise.", kind: "warn" },
      { id: "4.5.1", action: "Rapid double-click Ingest submit (or drop same file twice).", expectation: "One 202 job, second either dedup or second job but not two assets with same hash. No duplicate assets. Button disabled while pending.", kind: "info" },
      { id: "4.5.2", action: "Concurrency: open ingest in two tabs, upload different files to same collection simultaneously.", expectation: "Both jobs run, both succeed, asset count +2. No SQLITE_BUSY 500 due to write lock + single worker.", kind: "info" },
      { id: "4.6.1", action: "XSS: ingest file named '\x3Cscript>alert(1)\x3C/script>.txt' with content '<img src=x onerror=alert(1)>' then view Assets detail.", expectation: "Filename and text rendered via textContent/pre, no script execution. Locator chip shows file name as text.", kind: "danger" },
      { id: "4.6.2", action: "Non-ASCII: ingest file with utf-8 name 'نامه_فارسی.txt' and content with emojis '🌾📄'.", expectation: "200/202, asset title preserved, no mojibake. UI shows name correctly in LTR code span inside RTL page.", kind: "info" },
      { id: "4.7.1", action: "Web a11y: drag-drop area via keyboard (Tab to area, Space to open picker).", expectation: "Area has role=button, focus ring, Space/Enter opens file picker. Screen reader announces 'Drop a file here'.", kind: "info" },
    ]
  },
  {
    id: "5",
    title: "5 — Assets (server/routers/ingest.py GET /assets, /assets/{id})",
    rows: [
      { id: "5.1.1", action: "GET /assets?collection_id=valid after ingesting 2 files.", expectation: "200 array length 2, each {id, title, kind (document|code|raster|vector|table), collection_id, created_at}. Filter by collection_id works.", kind: "info" },
      { id: "5.1.2", action: "GET /assets with no workspace open, with invalid collection_id.", expectation: "No workspace → 409 workspace_not_open. Invalid collection → 200 empty array or 404, not 500.", kind: "info" },
      { id: "5.2.1", action: "GET /assets/{id} for ingested txt file.", expectation: "200 {asset, revision:{hash,size_bytes,mime_type}, segments:[{locator,file,page?, text}], scenes[], layers[], observations[]}. hash is 64-char hex SHA-256.", kind: "info" },
      { id: "5.2.2", action: "GET /assets/invalid-id and GET /assets/{id} with XSS id '\x3Cscript>'.", expectation: "404 envelope, not 500, not reflected XSS. No content is returned.", kind: "danger" },
      { id: "5.3.1", action: "Web: Assets page filter by collection (select dropdown, data-testid asset-filter).", expectation: "Table filters client-side, URL ?collection= is updated. Reload preserves filter. No request storm.", kind: "info" },
      { id: "5.3.2", action: "Web: click asset row → detail drawer (revision, segments, scenes, layers). Close with X or Esc or click outside.", expectation: "Drawer opens with data-testid asset-drawer, shows hash mono, segments text. Esc closes, focus returns to row. No scroll lock leak.", kind: "info" },

<script>
// render — all via textContent / escaping, single source QA_DATA
const LS_KEY = "gf-qa-manual-v1";
const $ = sel => document.querySelector(sel);
const main = $("#main");
const toc = $("#toc");
const searchEl = $("#search");
const filterEl = $("#filter");
const expandBtn = $("#expandBtn");
const resetBtn = $("#resetBtn");
const pOk = $("#p-ok"), pFail=$("#p-fail"), pNa=$("#p-na"), pRem=$("#p-rem");
const overallCounts = $("#overallCounts");
const backtop = $("#backtop");

let state = load();
function load(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch{ return {} }
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); updateProgress(); }
function getStatus(id){ return state[id] || "" }

function el(tag, cls, text){
  const e=document.createElement(tag);
  if(cls) e.className=cls;
  if(text!==undefined) e.textContent=text;
  return e;
}

function render(){
  main.innerHTML="";
  toc.innerHTML="";
  const q=(searchEl.value||"").toLowerCase();
  const f=filterEl.value;
  QA_DATA.forEach(sec=>{
    const secWrap = el("section","card");
    secWrap.id = "sec-"+sec.id;
    const header = el("header");
    const h2 = el("h2",null, sec.title);
    const cnt = el("span","count");
    const mini = el("div","mini");
    const sOk=el("span"), sFail=el("span"), sNa=el("span"), sRem=el("span");
    sOk.className="p-ok"; sFail.className="p-fail"; sNa.className="p-na"; sRem.className="p-rem";
    mini.append(sOk,sFail,sNa,sRem);
    header.append(h2, mini, cnt);
    header.addEventListener("click", ()=>{ secWrap.classList.toggle("collapsed"); body.style.display = secWrap.classList.contains("collapsed") ? "none" : ""; updateExpandBtn(); });
    secWrap.append(header);
    if(sec.intro){
      const intro = el("div",null, sec.intro);
      intro.style.cssText="padding:10px 14px; font-size:.84rem; color:var(--gf-muted); border-bottom:1px solid var(--gf-border)";
      secWrap.append(intro);
    }
    const body = el("div");
    const table = el("table","table");
    const thead = el("thead");
    const hr = el("tr");
    ["ID","Action / Input","Expectation",""].forEach(t=>{ const th=el("th",null,t); hr.append(th); });
    thead.append(hr); table.append(thead);
    const tbody = el("tbody");
    let visible=0, done=0, pass=0, fail=0, na=0;
    sec.rows.forEach(row=>{
      const txt = (row.action+" "+row.expectation+" "+(row.note||"")).toLowerCase();
      const st = getStatus(row.id);
      const matchSearch = !q || txt.includes(q) || row.id.toLowerCase().includes(q);
      const matchFilter = f==="all" || (f==="not-done" && !st) || f===st;
      if(!matchSearch || !matchFilter) return;
      visible++;
      if(st) done++;
      if(st==="pass") pass++; else if(st==="fail") fail++; else if(st==="na") na++;
      const tr = el("tr");
      if(st) tr.classList.add(st);
      const tdId = el("td","id mono", row.id);
      const tdAct = el("td");
      const actDiv = el("div",null, row.action);
      tdAct.append(actDiv);
      if(row.note){
        const n = el("div", "note "+(row.kind||"info"), row.note);
        if(row.kind==="danger") n.prepend(el("span",null,"⚠ Security: "));
        tdAct.append(n);
      }
      const tdExp = el("td",null, row.expectation);
      const tdCtrl = el("td");
      const acts = el("div","actions");
      const bP = el("button", st==="pass"?"on-pass":"", "✓");
      const bF = el("button", st==="fail"?"on-fail":"", "✕");
      const bN = el("button", st==="na"?"on-na":"", "–");
      bP.title="pass"; bF.title="fail"; bN.title="N/A";
      bP.setAttribute("aria-label","pass "+row.id); bF.setAttribute("aria-label","fail "+row.id); bN.setAttribute("aria-label","N/A "+row.id);
      bP.addEventListener("click", ()=>{ state[row.id]= state[row.id]==="pass" ? "" : "pass"; if(!state[row.id]) delete state[row.id]; save(); render(); });
      bF.addEventListener("click", ()=>{ state[row.id]= state[row.id]==="fail" ? "" : "fail"; if(!state[row.id]) delete state[row.id]; save(); render(); });
      bN.addEventListener("click", ()=>{ state[row.id]= state[row.id]==="na" ? "" : "na"; if(!state[row.id]) delete state[row.id]; save(); render(); });
      acts.append(bP,bF,bN); tdCtrl.append(acts);
      tr.append(tdId, tdAct, tdExp, tdCtrl);
      tbody.append(tr);
    });
    // update mini + cnt
    const total = sec.rows.length;
    const totalDone = sec.rows.filter(r=>getStatus(r.id)).length;
    const totalPass = sec.rows.filter(r=>getStatus(r.id)==="pass").length;
    const totalFail = sec.rows.filter(r=>getStatus(r.id)==="fail").length;
    const totalNa = sec.rows.filter(r=>getStatus(r.id)==="na").length;
    const rem = total - totalDone;
    sOk.style.width = (total? totalPass/total*100:0)+"%";
    sFail.style.width = (total? totalFail/total*100:0)+"%";
    sNa.style.width = (total? totalNa/total*100:0)+"%";
    sRem.style.width = (total? rem/total*100:0)+"%";
    cnt.textContent = visible===total ? (totalDone+"/"+total) : (visible+" / "+total+" (filtered)");
    table.append(tbody);
    body.append(table);
    secWrap.append(body);
    // hide empty filtered sections
    if(visible===0){ secWrap.style.display="none"; } else { secWrap.style.display=""; }
    main.append(secWrap);
    // toc
    const a = el("a",null, sec.title);
    a.href = "#sec-"+sec.id;
    const c = el("span","cnt", totalDone+"/"+total);
    a.append(c);
    toc.append(a);
  });
  updateProgress();
  highlightToc();
}

function updateProgress(){
  const all = QA_DATA.reduce((s,sec)=>s+sec.rows.length,0);
  const done = QA_DATA.reduce((s,sec)=>s+sec.rows.filter(r=>getStatus(r.id)).length,0);
  const pass = QA_DATA.reduce((s,sec)=>s+sec.rows.filter(r=>getStatus(r.id)==="pass").length,0);
  const fail = QA_DATA.reduce((s,sec)=>s+sec.rows.filter(r=>getStatus(r.id)==="fail").length,0);
  const na = QA_DATA.reduce((s,sec)=>s+sec.rows.filter(r=>getStatus(r.id)==="na").length,0);
  const rem = all - done;
  pOk.style.width = (all? pass/all*100:0)+"%";
  pFail.style.width = (all? fail/all*100:0)+"%";
  pNa.style.width = (all? na/all*100:0)+"%";
  pRem.style.width = (all? rem/all*100:0)+"%";
  overallCounts.textContent = pass+"✓ "+fail+"✕ "+na+"– "+rem+" left — "+all+" total";
  document.title = "QA "+pass+"✓ "+fail+"✕ — GeoFoundation";
}

function updateExpandBtn(){
  const anyCollapsed = document.querySelector("section.card.collapsed");
  expandBtn.textContent = anyCollapsed ? "expand all" : "collapse all";
}
expandBtn.addEventListener("click", ()=>{
  const anyCollapsed = document.querySelector("section.card.collapsed");
  document.querySelectorAll("section.card").forEach(sec=>{
    const body = sec.querySelector("div:last-child");
    if(anyCollapsed){ sec.classList.remove("collapsed"); if(body) body.style.display=""; }
    else { sec.classList.add("collapsed"); if(body) body.style.display="none"; }
  });
  updateExpandBtn();
});
searchEl.addEventListener("input", render);
filterEl.addEventListener("change", render);
resetBtn.addEventListener("click", ()=>{
  if(confirm("Reset all pass/fail/N/A states?")){
    state={}; save(); render();
  }
});
window.addEventListener("scroll", highlightToc, {passive:true});
function highlightToc(){
  const links = [...toc.querySelectorAll("a")];
  let active=null;
  for(const sec of QA_DATA){
    const el=document.getElementById("sec-"+sec.id);
    if(!el) continue;
    const r=el.getBoundingClientRect();
    if(r.top < 120) active=sec.id;
  }
  links.forEach(a=>{ a.classList.toggle("active", a.getAttribute("href")==="#sec-"+active); });
}
backtop.addEventListener("click", ()=> window.scrollTo({top:0, behavior: "smooth"}));
backtop.style.display = window.scrollY>400 ? "grid" : "none";
window.addEventListener("scroll", ()=>{ backtop.style.display = window.scrollY>400 ? "grid" : "none"; }, {passive:true});

render();
</script>
</body>
</html>
